    const item = gl.createShader(type);
    gl.shaderSource(item, source); gl.compileShader(item);
    if (!gl.getShaderParameter(item, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(item));
    return item;
  }
  const program = gl.createProgram();
  gl.attachShader(program, shader(gl.VERTEX_SHADER, vertexSource));
  gl.attachShader(program, shader(gl.FRAGMENT_SHADER, fragmentSource));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);
  const vertexBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, vertices.byteLength, gl.DYNAMIC_DRAW);
  for (const [name, size, start] of [['a_position', 3, 0], ['a_uv', 2, 3], ['a_normal', 3, 5]]) {
    const location = gl.getAttribLocation(program, name);
    gl.enableVertexAttribArray(location); gl.vertexAttribPointer(location, size, gl.FLOAT, false, stride * 4, start * 4);
  }
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW);
  gl.frontFace(gl.CW);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL);
  gl.enable(gl.BLEND); gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  const opacityUniform = gl.getUniformLocation(program, 'u_opacity');
  const creaseUniform = gl.getUniformLocation(program, 'u_crease');
  const liftUniform = gl.getUniformLocation(program, 'u_lift');
  const clamp = value => Math.max(0, Math.min(1, value));
  const ease = value => { const t = clamp(value); return t * t * t * (t * (6 * t - 15) + 10); };
  let progress = 0, running = false, slow = false, frame = 0, previous = 0, ready = false;

  function stateAt(t) {
    const lift = ease((t - .04) / .22), peel = ease((t - .22) / .55), release = ease((t - .78) / .22);
    return {
      length: 62 * lift + (halfLength * 2 - 62) * peel,
      bend: (2.25 * lift + .35 * peel) * (1 - .34 * release),
      radius: 21 + 6 * peel + 58 * release,
      release, opacity: 1 - ease((t - .93) / .07), lift
    };
  }

  // A cylindrical fold followed by a straight free end preserves the paper's
  // material length. Material before the advancing crease stays on the card.
  function surface(u, v, state) {
    const crease = halfLength - state.length;
    const distance = Math.max(0, u - crease);
    const curl = Math.min(distance / state.radius, state.bend);
    const tail = Math.max(0, distance - state.radius * state.bend);
    let x = u, z = 0;
    if (distance > 0) {
      x = crease + state.radius * Math.sin(curl) + tail * Math.cos(state.bend);
      z = state.radius * (1 - Math.cos(curl)) + tail * Math.sin(state.bend);
    }
    // Once the last edge releases, the whole sheet can leave the surface.
    const rotation = state.release * .22, cr = Math.cos(rotation), sr = Math.sin(rotation);
    const xr = x * cr - v * sr, yr = x * sr + v * cr;
    const wx = center.x + scale * (ca * xr - sa * yr) + state.release * 220;
    const wy = center.y + scale * (sa * xr + ca * yr) - state.release * 110;
    const wz = z * scale + state.release * 190;
    const nx = -Math.sin(curl) * Math.cos(angle + rotation);
    const ny = -Math.sin(curl) * Math.sin(angle + rotation);
    return { x: wx, y: wy, z: wz, nx, ny, nz: Math.cos(curl) };
  }

  function render() {
    if (!ready) return;
    const state = stateAt(progress);
    for (let row = 0; row <= rows; row++) for (let col = 0; col <= cols; col++) {
      const u = -halfLength + col / cols * halfLength * 2;
      const v = -halfWidth + row / rows * halfWidth * 2;
      const point = surface(u, v, state), perspective = 1100 / (1100 - point.z);
      const index = (row * (cols + 1) + col) * stride;
      vertices[index] = W / 2 + (point.x - W / 2) * perspective;
      vertices[index + 1] = H / 2 + (point.y - point.z * .72 - H / 2) * perspective;
      vertices[index + 2] = point.z;
      vertices[index + 3] = (148.8991 + ca * u - sa * v) / 297.7981;
      vertices[index + 4] = (104.2318 + sa * u + ca * v) / 208.4637;
      vertices[index + 5] = point.nx; vertices[index + 6] = point.ny; vertices[index + 7] = point.nz;
    }
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.uniform1f(opacityUniform, state.opacity);
    gl.uniform1f(creaseUniform, halfLength - state.length);
    gl.uniform1f(liftUniform, state.lift * (1 - state.release));
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, vertices);
    gl.drawElements(gl.TRIANGLES, indices.length, gl.UNSIGNED_SHORT, 0);
    drawShadow(state);
    $('progress').value = Math.round(progress * 1000);
    $('time').textContent = `${(progress * duration / 1000).toFixed(2)} / 3.60 s`;
    const phase = progress < .08 ? '右上端先翘起' : progress < .27 ? '揪起一端 · 露出纸背' : progress < .78 ? '沿长轴逐渐揭开' : progress < .98 ? '最后一端松开 · 轻轻带走' : '贴纸已揭下';
    if ($('phase').textContent !== phase) $('phase').textContent = phase;
  }

  function drawShadow(state) {
    const ratio = shadow.width / W;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, shadow.width, shadow.height);
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    const points = [];
    let height = 0;
    for (let i = 0; i < 120; i++) {
      const theta = i / 120 * Math.PI * 2;
      const point = surface(halfLength * Math.cos(theta), halfWidth * Math.sin(theta), state);
      height += point.z / 120;
      points.push({ x: point.x + point.z * .22, y: point.y + point.z * .24 });
    }
    ctx.filter = `blur(${(1.4 + Math.min(16, height * .095)) * ratio}px)`;
    ctx.fillStyle = `rgba(59, 43, 23, ${.19 * state.opacity * (1 - state.release * .85)})`;
    ctx.beginPath(); points.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.closePath(); ctx.fill();
    ctx.filter = 'none';
  }

  function resize() {
    const pixels = Math.min(devicePixelRatio || 1, 2);
    const width = Math.max(1, Math.round(stage.clientWidth * pixels));
    const height = Math.max(1, Math.round(width * H / W));
    canvas.width = shadow.width = width; canvas.height = shadow.height = height;
    gl.viewport(0, 0, width, height); render();
  }
  function stop() { running = false; cancelAnimationFrame(frame); frame = 0; $('play').textContent = progress >= 1 ? '再撕一次' : progress > 0 ? '继续播放' : '撕下贴纸'; }
  function tick(now) {
    if (!running) return;
    progress = Math.min(1, progress + Math.min(64, now - previous) / duration * (slow ? .5 : 1));
    previous = now; render();
    if (progress >= 1) stop(); else frame = requestAnimationFrame(tick);
  }
  function play(restart = false) {
    if (!ready) return;
    if (restart || progress >= 1) progress = 0;
    if (running) return;
    running = true; previous = performance.now(); $('play').textContent = '暂停'; frame = requestAnimationFrame(tick);
  }
  $('play').addEventListener('click', () => running ? stop() : play());
  $('peel-hit').addEventListener('click', () => { stop(); play(true); });
  $('reset').addEventListener('click', () => { progress = 0; stop(); render(); });
  $('slow').addEventListener('click', () => { slow = !slow; $('slow').setAttribute('aria-pressed', String(slow)); });
  $('progress').addEventListener('input', event => { progress = Number(event.target.value) / 1000; stop(); render(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); });
  new ResizeObserver(resize).observe(stage);
  canvas.addEventListener('webglcontextlost', event => { event.preventDefault(); stop(); ready = false; $('phase').textContent = '绘制已暂停，请刷新预览。'; });

  const artwork = $('sticker-art').content.querySelector('svg').cloneNode(true);
  artwork.setAttribute('width', '1192'); artwork.setAttribute('height', '834');
  const image = new Image();
  image.onload = () => {
    gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
    ready = true; resize();
    // Respect reduced motion; there is never a repeating background loop.
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) play();
  };
  image.onerror = () => { $('phase').textContent = '贴纸素材未能加载，请刷新预览。'; };
  image.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(artwork));
})();
</script>
</body>

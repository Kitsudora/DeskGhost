<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>DeskGhost</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="graph.css">
</head>
<body data-mode="graph">
  <canvas id="flock" aria-hidden="true"></canvas>
  <main id="manager" aria-label="任务工作区">
    <header class="workspace-bar glass" data-interactive>
      <span class="brand brand-mark" id="pet-recall" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="currentColor"><path d="M14 3Q15 1 17 4L25 16Q27 19 23 18L8 15Q5 14 8 11Z"/><path d="M5 18Q4 16 7 17L16 22Q18 23 15 24L6 27Q4 28 4 25Z"/><path d="M23 22Q24 20 25 23L28 28Q29 30 26 29L20 27Q18 26 20 25Z"/></svg>
      </span>
      <div class="brand-name">DeskGhost<span>桌间微光</span></div>
      <span class="bar-divider"></span>
      <button id="workspace-toggle" class="workspace-toggle" aria-expanded="false"><span id="workspace-name">正在打开工作区</span><svg viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"/></svg></button>
      <span id="save-indicator" class="save-indicator" title="正在连接本地数据服务"></span>
      <div class="bar-spacer"></div>
      <button id="open-search" class="icon-button" title="查找任务 · Ctrl+F" aria-label="查找任务"><svg viewBox="0 0 24 24"><circle cx="10.7" cy="10.7" r="6.3"/><path d="m15.5 15.5 4.4 4.4"/></svg></button>
      <button id="open-settings" class="icon-button" title="偏好设置" aria-label="偏好设置"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.5"/><circle cx="16" cy="17" r="2.5"/></svg></button>
      <button id="hide-manager" class="icon-button" title="收起到桌宠 · Esc" aria-label="收起到桌宠"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
    </header>

    <section id="workspace-menu" class="popover glass" data-interactive hidden>
      <div class="eyebrow">已打开的工作区</div>
      <div id="workspace-list"></div>
      <div class="menu-rule"></div>
      <button class="menu-action" id="new-workspace">＋ 新建工作区</button>
      <button class="menu-action" id="open-workspace">↗ 打开工作区文件</button>
      <button class="menu-action" id="recover-workspace">从 .bak 备份恢复工作区</button>
      <button class="menu-action" id="export-workspace">导出 / 备份</button>
      <button class="menu-action" id="save-as">另存并继续</button>
      <button class="menu-action subtle-danger" id="close-workspace">关闭当前工作区</button>
    </section>

    <section id="graph-board" aria-label="可拖拽任务图" data-interactive tabindex="0"></section>
    <div id="board-caption" aria-hidden="true"><span id="board-stats">每个想法，都可以成为起点</span><span>拖动连接点建立路径 · 拖离端点断开 · 卡片自动吸附</span></div>

    <section id="search-panel" class="search-panel glass" data-interactive hidden aria-label="查找任务">
      <div class="panel-heading"><h2>找到那一步</h2><button data-close="search-panel" class="icon-button" aria-label="关闭搜索">×</button></div>
      <label class="search-field"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input id="search-title" placeholder="按标题查找…" maxlength="256" autocomplete="off"></label>
      <div class="filter-row"><select id="search-state" aria-label="状态筛选"><option value="">全部状态</option value="NotStarted">未开始</option><option value="InProgress">进行中</option><option value="Completed">已完成</option><option value="Stopped">已停止</option></select><select id="search-category" aria-label="分类筛选"><option value="*">全部分类</option></select></div>
      <div class="result-summary"><span id="result-count">0 个结果</span><button class="text-button" id="clear-search">清除筛选</button></div>
      <div id="search-results" role="list" class="search-results"></div>
    </section>

    <nav class="work-dock glass" aria-label="任务工具栏" data-interactive>
      <div class="segmented"><button id="graph-mode" class="active" title="任务图"><svg viewBox="0 0 20 20"><rect x="2" y="7" width="5" height="6" rx="1.5"/><rect x="13" y="2" width="5" height="6" rx="1.5"/><rect x="13" y="12" width="5" height="6" rx="1.5"/><path d="M7 10h3V5h3m-3 5v5h3"/></svg><span>任务图</span></button><button id="category-mode" title="分类视图"><svg viewBox="0 0 20 20"><rect x="2.5" y="3" width="6" height="14" rx="2"/><rect x="11.5" y="3" width="6" height="9" rx="2"/></svg><span>分类</span></button></div>
      <span class="bar-divider"></span>
      <button id="undo" class="icon-button" aria-label="撤销" title="撤销 · Ctrl+Z"><svg viewBox="0 0 24 24"><path d="M8 6 3 11l5 5M4 11h10a6 6 0 0 1 6 6"/></svg></button>
      <button id="redo" class="icon-button" aria-label="重做" title="重做 · Ctrl+Shift+Z"><svg viewBox="0 0 24 24"><path d="m16 6 5 5-5 5m4-5H10a6 6 0 0 0-6 6"/></svg></button>
      <button id="add-column" class="icon-button" aria-label="增加逻辑时间列" title="增加逻辑时间列"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="16" rx="2"/><path d="M17 8v8m-4-4h8"/></svg></button>
      <select id="history-view" title="归档与回收站" aria-label="任务范围"><option value="active">当前任务</option><option value="all">包含归档</option><option value="archived">已归档</option><option value="trash">回收站</option></select>
      <span class="bar-divider"></span>
      <button id="new-task" class="primary-button"><span class="plus">＋</span> 新建任务 <kbd>N</kbd></button>
    </nav>
    <div class="zoom-tools glass" data-interactive><button id="zoom-out" title="缩小" aria-label="缩小">−</button><button id="fit-graph" title="适应任务图">适应</button><button id="zoom-in" title="放大" aria-label="放大">＋</button></div>
    <div id="selection-tools" class="selection-tools glass" data-interactive hidden><span id="selection-count"></span><button id="edit-selected">编辑</button><button id="continue-selected">延续 / 汇合 →</button><button id="archive-selected">归档</button><button id="restore-selected">恢复</button><button id="delete-selected" class="subtle-danger">删除</button></div>
  </main>

  <button id="wand-anchor" class="wand-anchor" type="button" data-interactive hidden aria-label="单击创建任务"></button>

  <section id="composer" class="composer dg-card-surface" data-interactive hidden aria-label="任务卡片编辑器" aria-describedby="composer-eyebrow">
    <form id="task-form" novalidate>
      <header class="composer-top dg-card-top">
        <span class="visually-hidden" id="composer-eyebrow">捕捉下一步</span>
        <span class="composer-initial-state dg-task-state"><i class="dg-state-dot" aria-hidden="true"></i>未开始</span>
        <label id="edit-status-field" class="composer-state dg-task-state" hidden><span class="visually-hidden">任务状态</span><i class="dg-state-dot" aria-hidden="true"></i><select id="task-state" aria-label="任务状态"><option value="NotStarted">未开始</option><option value="InProgress">进行中</option><option value="Completed">已完成</option><option value="Stopped">已停止</option></select></label>
        <button id="close-composer" class="dg-card-action" type="button" aria-label="取消编辑">×</button>
      </header>
      <label class="composer-workspace"><span>工作区</span><select id="task-workspace" aria-label="所属工作区"></select></label>
      <div id="source-summary" class="source-summary" hidden></div>
      <label class="composer-title"><span class="visually-hidden">标题</span><input id="task-title" class="dg-card-title-input" placeholder="给这一步起个名字" maxlength="256" autocomplete="off" required></label>
      <label class="composer-description"><span class="visually-hidden">内容</span><textarea id="task-description" class="dg-card-description-input" placeholder="记录想法、细节，或下一步…" maxlength="16000" rows="4"></textarea></label>
      <label class="composer-category dg-category-pill"><span class="visually-hidden">分类</span><input id="task-category" list="category-suggestions" placeholder="分类 / 新建分类" maxlength="80" autocomplete="off"><datalist id="category-suggestions"></datalist></label>
      <p id="composer-error" class="inline-error" role="alert"></p>
      <footer class="composer-footer"><span id="composer-hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> 下一栏</span><button type="submit" id="submit-task" class="primary-button">创建任务 <span>↗</span></button></footer>
    </form>
  </section>

  <section id="settings-panel" class="settings-panel glass" data-interactive hidden aria-label="偏好设置">
    <div class="panel-heading"><div><span class="eyebrow">DESKGHOST / PREFERENCES</span><h2>让它按你的方式存在</h2></div><button data-close="settings-panel" class="icon-button" aria-label="关闭设置">×</button></div>
    <label class="setting"><span><strong>碎片效果</strong><small>白色圆角三角 · 群鸟运动</small></span><select id="setting-effects"><option value="high">流畅 · 60 fps</option><option value="low">轻量 · 30 fps</option><option value="off">关闭动画</option></select></label>
    <label class="setting"><span><strong>魔杖启用</strong><small>仅待机时识别，连续画两圈 · 直径约屏幕高度的 1/4</small></span><input id="setting-gesture" type="checkbox" role="switch"></label>
    <div class="setting setting-dismiss-speed"><label for="setting-dismiss-speed"><strong>驱散速度</strong><small id="dismiss-speed-unit">屏高/秒 · 调低更容易驱散</small></label><output id="dismiss-speed-value" for="setting-dismiss-speed">1.5</output><input id="setting-dismiss-speed" type="range" min="0.5" max="4" step="0.1" value="1.5" aria-describedby="dismiss-speed-unit"></div>
    <label class="setting"><span><strong>闲置时漫游</strong><small>平时停在屏幕外，恢复操作后退场</small></span><select id="setting-roam"><option value="180">3 分钟后</option><option value="300">5 分钟后</option><option value="600">10 分钟后</option><option value="0">关闭漫游</option></select></label>
    <label class="setting"><span><strong>创建任务快捷键</strong></span><input id="setting-create-key" maxlength="80" aria-label="创建任务快捷键"></label>
    <label class="setting"><span><strong>任务图快捷键</strong></span><input id="setting-graph-key" maxlength="80" aria-label="任务图快捷键"></label>
    <div class="setting storage-setting"><span><strong>新工作区存储位置</strong><small id="data-folder"></small></span><button id="choose-folder" class="secondary-button">更改</button></div>
    <p class="settings-note">已打开的文件保持原位置。字体暂用现有字体占位，后续再选择。</p>
    <p id="settings-error" class="inline-error" role="alert"></p>
    <footer class="settings-footer"><button id="quit-app" class="text-button">退出 DeskGhost</button><button id="apply-settings" class="primary-button">保存设置</button></footer>
  </section>

  <section id="name-prompt" class="name-prompt glass" data-interactive hidden aria-label="新建工作区"><form id="workspace-form"><div class="panel-heading"><h2>一片新的工作空间</h2><button class="icon-button" type="button" data-close="name-prompt" aria-label="取消新建工作区">×</button></div><input id="workspace-input" placeholder="工作区名称" maxlength="120" required autocomplete="off"><button class="primary-button" type="submit">创建工作区 →</button></form></section>
  <div id="toast" class="toast glass" role="status" data-interactive hidden></div>
  <div id="boot-screen" class="boot-screen glass" data-interactive><div class="boot-spark"></div><h1>DeskGhost</h1><p id="boot-message">正在打开你的工作空间…</p><button id="retry-boot" class="secondary-button" hidden>重试连接</button></div>
  <script type="module" src="app.js"></script>
</body>
</html>

name: Windows desktop build and checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Identify release
        id: version
        env:
          RELEASE_BUILD: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/release/v') || startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected a stable semantic version in package.json.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "release=$env:RELEASE_BUILD" >> $env:GITHUB_OUTPUT
          if ($env:RELEASE_BUILD -eq 'true') {
            $tag = "v$version"
            if ($env:GITHUB_REF_NAME -notin @($tag, "release/$tag")) { throw 'Release ref must match package.json version.' }
            if (!(Test-Path "docs/releases/$tag.md")) { throw 'Release notes are missing.' }
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install desktop dependencies
        run: npm ci
      - name: Build current desktop data service
        run: dotnet build src/DeskGhost.Bridge/DeskGhost.Bridge.csproj --configuration Release
      - name: Check graph rules and safe persistence
        run: dotnet run --project tests/DeskGhost.Checks/DeskGhost.Checks.csproj --configuration Release
      - name: Check desktop gesture logic
        run: npm test
      - name: Check real Electron interaction and saving
        run: npm run test:ui
      - name: Build Windows x64 portable application
        if: steps.version.outputs.release == 'true'
        run: npm run build -- --out artifacts/release
      - name: Check packaged application and runtime notices
        if: steps.version.outputs.release == 'true'
        env:
          DESKGHOST_EXE: ${{ github.workspace }}\artifacts\release\DeskGhost-win32-x64\DeskGhost.exe
        run: npm run test:ui
      - name: Archive portable application
        if: steps.version.outputs.release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $archive = "DeskGhost-v$env:RELEASE_VERSION-win-x64.zip"
          Compress-Archive -Path artifacts/release/DeskGhost-win32-x64 -DestinationPath "artifacts/release/$archive" -CompressionLevel Optimal
          $hash = (Get-FileHash "artifacts/release/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'artifacts/release/SHA256SUMS.txt'), "$hash  $archive`n", [Text.Encoding]::ASCII)
      - name: Retain verified release files
        if: steps.version.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            artifacts/release/*.zip
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
      - name: Retain UI failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-ui-failure
          path: .local/web-smoke/**/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  release:
    needs: verify
    if: needs.verify.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: windows-release
          path: release-files
      - name: Verify archive checksum
        working-directory: release-files
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          tag="v$RELEASE_VERSION"
          existing=$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if [ -n "$existing" ] && ! printf '%s\n' "$existing" | cut -f1 | grep -Fxq "$GITHUB_SHA"; then
            echo "Release tag already points to a different commit." >&2
            exit 1
          fi
          gh release create "$tag" "release-files/DeskGhost-$tag-win-x64.zip" release-files/SHA256SUMS.txt --target "$GITHUB_SHA" --title "DeskGhost $tag" --notes-file "docs/releases/$tag.md" --draft
          gh release edit "$tag" --draft=false --latest
